<!DOCTYPE html>
<html>
<head>
    <title>Edit Item</title>
</head>
<body>
    <h2>Edit Item: {{ item.title }}</h2>

        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update Item</button>
    </form>
    <a href="{% url 'item_list' %}">Cancel</a>
</body>
</html>
