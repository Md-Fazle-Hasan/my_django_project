<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Order #{{ order.order_id }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        form { background: #f4f4f4; padding: 20px; border-radius: 5px; max-width: 500px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { padding: 8px 12px; background: #007bff; color: white; border: none; cursor: pointer; }
        .btn-cancel { padding: 8px 12px; background: #6c757d; color: white; text-decoration: none; border-radius: 3px; display: inline-block; margin-left: 10px; }
    </style>
</head>
<body>

    <h1>Edit Order #{{ order.order_id }}</h1>
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" name="product_name" value="{{ order.product_name }}" required>
        </div>

        <div class="form-group">
            <label>Size</label>
            <input type="text" name="size" value="{{ order.size|default:'' }}">
        </div>

        <div class="form-group">
            <label>Color</label>
            <input type="text" name="color" value="{{ order.color|default:'' }}">
        </div>

        <div class="form-group">
            <label>Quantity</label>
            <input type="number" name="quantity" value="{{ order.quantity }}" min="1" required>
        </div>

        <div class="form-group">
            <label>Unit Price ($)</label>
            <input type="number" step="0.01" name="unit_price" value="{{ order.unit_price }}" required>
        </div>

        <div class="form-group">
            <label>Status</label>
            <select name="status">
                <option value="NEW" {% if order.status == 'NEW' %}selected{% endif %}>New</option>
                <option value="CONFIRMED" {% if order.status == 'CONFIRMED' %}selected{% endif %}>Confirmed</option>
                <option value="PROCESSING" {% if order.status == 'PROCESSING' %}selected{% endif %}>Processing</option>
                <option value="READY_FOR_DELIVERY" {% if order.status == 'READY_FOR_DELIVERY' %}selected{% endif %}>Ready for Delivery</option>
                <option value="DELIVERED" {% if order.status == 'DELIVERED' %}selected{% endif %}>Delivered</option>
                <option value="CANCELLED" {% if order.status == 'CANCELLED' %}selected{% endif %}>Cancelled</option>
            </select>
        </div>

        <button type="submit" class="btn">Update Order</button>
        <a href="{% url 'index' %}" class="btn-cancel">Cancel</a>
    </form>

</body>
</html>
